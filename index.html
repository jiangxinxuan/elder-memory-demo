<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>老人回忆小程序 Demo</title>
  <style>
    :root {
      --page-bg: #edf1f5;
      --phone-bg: #ffffff;
      --soft-bg: #f5f7fa;
      --text: #1f2328;
      --muted: #667085;
      --border: #d0d7de;
      --accent: #2f80c4;
      --accent-text: #ffffff;
      --warning-bg: #fff7e6;
      --warning-text: #7a4b00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--page-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .phone {
      width: min(430px, 100vw);
      height: min(860px, 100vh);
      background: var(--phone-bg);
      border: 1px solid var(--border);
      border-radius: 30px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .status {
      height: 28px;
      display: flex;
      justify-content: center;
      align-items: end;
      color: var(--muted);
      font-size: 12px;
      padding-bottom: 4px;
    }

    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
    }

    .topbar-title {
      font-weight: 700;
      font-size: 18px;
    }

    .link-button {
      border: 0;
      background: transparent;
      color: var(--accent);
      font-size: 15px;
      font-weight: 700;
      padding: 8px 0;
      cursor: pointer;
    }

    .link-button:disabled {
      color: #a0a7b1;
      cursor: not-allowed;
    }

    .content {
      flex: 1;
      overflow: auto;
      padding: 18px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      border: 1px solid var(--border);
      background: var(--soft-bg);
      border-radius: 16px;
      padding: 14px;
    }

    .white-card {
      background: #ffffff;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    h1 {
      font-size: 24px;
      line-height: 1.25;
    }

    h2 {
      font-size: 20px;
      line-height: 1.35;
    }

    h3 {
      font-size: 17px;
      line-height: 1.4;
    }

    p {
      font-size: 16px;
      line-height: 1.65;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 13px;
    }

    .button {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--accent-text);
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      padding: 10px 14px;
    }

    .button.secondary {
      border-color: #b8b8b8;
      background: #e9e9e9;
      color: var(--text);
    }

    .button:disabled {
      border-color: #c8cdd3;
      background: #d8dde3;
      color: #77808b;
      cursor: not-allowed;
    }

    .record-button {
      width: 174px;
      height: 174px;
      border-radius: 999px;
      align-self: center;
      font-size: 22px;
      margin: 10px 0;
    }

    .pill {
      width: fit-content;
      border-radius: 999px;
      background: #eaf4fc;
      color: #1e5b96;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
    }

    .pill.warning {
      background: var(--warning-bg);
      color: var(--warning-text);
    }

    .notice {
      border: 1px solid #9ed5b2;
      background: #eefbf2;
      color: #25613a;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 15px;
      line-height: 1.55;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .message-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .step-text {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .pill.success {
      background: #e7f6ed;
      color: #1f7a3f;
    }

    .toast {
      border: 1px solid #b8e0c4;
      background: #eefaf2;
      color: #1f7a3f;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 15px;
      line-height: 1.5;
    }

    .story-text {
      white-space: pre-wrap;
    }

    .recording {
      background: #c0392b;
      border-color: #c0392b;
    }

    .timeline-card {
      position: relative;
    }

    .meta {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    .checkbox-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-size: 15px;
      line-height: 1.5;
    }

    .checkbox-row input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .age-group {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 800;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 14px;
      color: var(--muted);
      font-weight: 700;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      padding: 10px 12px;
      font-size: 15px;
      line-height: 1.5;
      color: var(--text);
      font-family: inherit;
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .chat-stream {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-row {
      display: flex;
      width: 100%;
    }

    .chat-row.user {
      justify-content: flex-end;
    }

    .chat-row.system {
      justify-content: flex-start;
    }

    .chat-bubble {
      max-width: 85%;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
      border: 1px solid var(--border);
    }

    .chat-bubble.user {
      background: #eaf4fc;
      border-color: #b8d8f1;
    }

    .chat-bubble.system {
      background: #f5f7fa;
    }

    .bottom-nav {
      border-top: 1px solid var(--border);
      padding: 10px 14px 14px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      background: #ffffff;
    }

    .nav-dot {
      border: 1px solid var(--border);
      background: #ffffff;
      border-radius: 999px;
      height: 34px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }

    .nav-dot.active {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 800;
      background: #eaf4fc;
    }

    @media (max-height: 760px) {
      body { align-items: flex-start; }
      .phone { height: 100vh; border-radius: 0; }
    }
  </style>
</head>
<body>
  <main class="phone">
    <div class="status">9:41</div>
    <header class="topbar">
      <button id="backButton" class="link-button" type="button">返回</button>
      <div class="topbar-title">老人回忆</div>
      <button id="topRightButton" class="link-button" type="button">时间线</button>
    </header>
    <section id="content" class="content"></section>
    <nav id="bottomNav" class="bottom-nav"></nav>
  </main>

  <script>
    const flow = ["home", "confirm", "timeline"];
    const navLabels = {
      home: "首页",
      confirm: "确认",
      timeline: "时间线"
    };

    let currentPage = "home";
    const state = {
      notice: "",
      draft: null,
      timeline: [],
      isSaving: false,
      isRecording: false,
      chatMessages: [],
      elderProfile: {
        name: "王桂兰"
      },
      form: {
        memoryInput: ""
      }
    };

    function showNotice(message) {
      state.notice = message;
    }

    function clearNotice() {
      state.notice = "";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function canVisit(page) {
      if (page === "confirm") return Boolean(state.draft);
      if (page === "timeline") return state.timeline.length > 0;
      return true;
    }

    function setPage(page) {
      if (!canVisit(page)) {
        showNotice("请先在首页录入回忆内容并生成草稿。");
        render();
        return;
      }
      currentPage = page;
      render();
    }

    function getPreviousPage() {
      if (currentPage === "confirm") return "home";
      if (currentPage === "timeline") {
        if (state.draft && !state.timeline.some((item) => item.id === state.draft.id)) return "confirm";
        return "home";
      }
      return "home";
    }

    function goBack() {
      setPage(getPreviousPage());
    }

    function resetMemorySession() {
      state.draft = null;
      state.isRecording = false;
      state.chatMessages = [];
      state.form.memoryInput = "";
    }

    function startNewMemory() {
      resetMemorySession();
      clearNotice();
      setPage("home");
    }

    function updateFormField(field, value) {
      state.form[field] = value;
    }

    function toggleRecording() {
      state.isRecording = !state.isRecording;
      if (!state.isRecording && !state.form.memoryInput.trim()) {
        state.form.memoryInput = "我想起老粮站旁边，父亲把白面让给邻居。";
        showNotice("录音结束，已填入回忆内容示例，可以直接点击生成。");
      }
      render();
    }

    function generateDraft() {
      const memoryInput = document.getElementById("memoryInput")?.value || "";
      state.form.memoryInput = memoryInput;
      const sentMemories = state.chatMessages
        .filter((message) => message.role === "user")
        .map((message) => message.text);

      const normalizedName = state.elderProfile.name.trim() || "老人";
      const normalizedMemory = sentMemories.join("；").trim();

      if (!normalizedMemory) {
        showNotice("请先发送回忆内容，再生成故事草稿。");
        render();
        return;
      }

      const trimmed = normalizedMemory.length > 18 ? `${normalizedMemory.slice(0, 18)}...` : normalizedMemory;
      const title = `${normalizedName}的回忆：${trimmed}`;
      const body = `${normalizedName}提到：${normalizedMemory}`;

      state.draft = {
        id: Date.now(),
        elderName: normalizedName,
        elderIdentity: "",
        memoryInput: normalizedMemory,
        title,
        body,
        createdAt: new Date().toLocaleString("zh-CN")
      };

      showNotice("草稿已生成，请确认后保存到时间线。");
      setPage("confirm");
    }

    function sendMemory() {
      const memoryInput = document.getElementById("memoryInput")?.value || "";
      const normalizedMemory = memoryInput.trim();
      state.form.memoryInput = memoryInput;
      if (!normalizedMemory) {
        showNotice("请先说点内容，再发送。");
        render();
        return;
      }
      state.chatMessages.push({
        role: "user",
        text: normalizedMemory
      });
      state.chatMessages.push({
        role: "system",
        text: "我先把这段回忆记下来了。你可以继续说下一段，我会一起整理成故事草稿。"
      });
      state.form.memoryInput = "";
      clearNotice();
      render();
    }

    function confirmSave() {
      if (!state.draft) {
        showNotice("没有可保存的草稿，请先生成。");
        render();
        return;
      }

      if (state.isSaving) return;
      state.isSaving = true;

      const hasSaved = state.timeline.some((item) => item.id === state.draft.id);
      if (hasSaved) {
        state.isSaving = false;
        showNotice("该草稿已在时间线中，无需重复保存。");
        setPage("timeline");
        return;
      }

      state.timeline.unshift({ ...state.draft });
      state.draft = null;
      state.isSaving = false;
      showNotice("已确认保存到时间线。");
      setPage("timeline");
    }

    function renderNav() {
      document.getElementById("bottomNav").innerHTML = flow
        .map((page) => {
          const disabled = canVisit(page) ? "" : "disabled";
          return `<button class="nav-dot ${page === currentPage ? "active" : ""}" ${disabled} onclick="setPage('${page}')">${navLabels[page]}</button>`;
        })
        .join("");
    }

    function renderNotice() {
      return state.notice ? `<div class="notice">${escapeHtml(state.notice)}</div>` : "";
    }

    function renderStep() {
      const labels = ["首页录入", "生成确认", "保存时间线"];
      const stepIndex = Math.max(0, Math.min(flow.indexOf(currentPage), labels.length - 1));
      return `<div class="step-text">V1.0 happy path：${labels.map((label, index) => (index === stepIndex ? `【${label}】` : label)).join(" → ")}</div>`;
    }

    function renderHome() {
      const chatList = state.chatMessages
        .map(
          (message) => `
            <div class="chat-row ${message.role}">
              <div class="chat-bubble ${message.role}">${escapeHtml(message.text)}</div>
            </div>
          `
        )
        .join("");
      return `
        <div class="stack">
          ${renderStep()}
          ${renderNotice()}
          <h1>想起什么，就先说下来</h1>
          <p class="muted">随便说几句也可以，记不清的地方可以先放着。</p>
          <div class="card stack">
            ${
              chatList
                ? `<div class="chat-stream">${chatList}</div>`
                : ``
            }
            <button id="recordButton" class="button record-button ${state.isRecording ? "recording" : ""}" onclick="toggleRecording()">
              ${state.isRecording ? "结束录音" : "按住说话"}
            </button>
            <div class="field">
              <label for="memoryInput">输入并发送</label>
              <textarea id="memoryInput" placeholder="例如：年轻时在粮站排队，父亲把白面让给邻居家。" oninput="updateFormField('memoryInput', this.value)">${escapeHtml(state.form.memoryInput)}</textarea>
            </div>
            <button class="button" onclick="sendMemory()">发送</button>
          </div>
          <button class="button" onclick="generateDraft()">生成故事草稿</button>
          <button class="button secondary" ${state.timeline.length > 0 ? "onclick=\"setPage('timeline')\"" : "disabled"}>先保存，不整理</button>
        </div>
      `;
    }

    function renderConfirm() {
      const draft = state.draft;
      if (!draft) {
        return `
          <div class="stack">
            ${renderStep()}
            ${renderNotice()}
            <h1>暂无草稿</h1>
            <button class="button" onclick="setPage('home')">返回首页填写</button>
          </div>
        `;
      }

      return `
        <div class="stack">
          ${renderStep()}
          ${renderNotice()}
          <span class="pill warning">AI 整理草稿</span>
          <h1>${escapeHtml(draft.title)}</h1>
          <div class="card white-card stack">
            <p class="story-text">${escapeHtml(draft.body)}</p>
            <p class="meta">生成时间：${escapeHtml(draft.createdAt)}</p>
          </div>
          <p class="muted">如果不满意，可以返回上一页继续修改内容。</p>
          <button class="button" ${state.isSaving ? "disabled" : ""} onclick="confirmSave()">${state.isSaving ? "保存中..." : "确认保存"}</button>
          <button class="button secondary" onclick="goBack()">返回修改</button>
        </div>
      `;
    }

    function renderTimeline() {
      const hasItems = state.timeline.length > 0;
      return `
        <div class="stack">
          ${renderStep()}
          ${renderNotice()}
          <h1>我的时间线</h1>
          <p class="muted">按年龄每 20 年一组。日期想不起来时，AI 只用于归组，不写成确定事实。</p>
          ${
            hasItems
              ? state.timeline
                  .map(
                    (item) => `
                      <div class="card stack">
                        <h3>${escapeHtml(item.title)}</h3>
                        <p class="story-text">${escapeHtml(item.body)}</p>
                        <p class="meta">${escapeHtml(item.createdAt)}</p>
                      </div>
                    `
                  )
                  .join("")
              : `<div class="card"><p class="muted">还没有内容。请先回到首页完成“输入 -> 生成 -> 确认保存”。</p></div>`
          }
          <button class="button secondary" onclick="startNewMemory()">继续新增回忆</button>
        </div>
      `;
    }

    function renderContent() {
      const renderers = {
        home: renderHome,
        confirm: renderConfirm,
        timeline: renderTimeline
      };
      document.getElementById("content").innerHTML = renderers[currentPage]();
    }

    function render() {
      document.getElementById("backButton").onclick = goBack;
      const topRightButton = document.getElementById("topRightButton");
      if (currentPage === "timeline") {
        topRightButton.textContent = "新增回忆";
        topRightButton.disabled = false;
        topRightButton.onclick = startNewMemory;
      } else {
        topRightButton.textContent = "时间线";
        topRightButton.disabled = false;
        topRightButton.onclick = () => setPage("timeline");
      }
      renderContent();
      renderNav();
      clearNotice();
    }

    render();
  </script>
</body>
</html>
